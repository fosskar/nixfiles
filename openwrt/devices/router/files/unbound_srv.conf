##############################################################################
# User custom options added in the server: clause part of UCI 'unbound.conf'
#
# Add your own option statements here when they are not covered by UCI. This
# file is placed _inside_ the server: clause with an include: statement. Do
# not start other clauses here, because that would break the server: clause.
# Use 'unbound_ext.conf' to start new clauses at the end of 'unbound.conf'.
##############################################################################

# this is for keeping rebind protection but allow domains to resolve to local ips
private-domain: "nx3.eu"

# bind loopback only: adguard home (127.0.0.1) is the sole client;
# lan clients must not bypass filtering by querying 5335 directly
interface-automatic: no
interface: 127.0.0.1
interface: ::1

# split-horizon dns: keep *.nx3.eu reachable on lan when wan/upstream dns is down.
# all nx3.eu names resolve to the local reverse proxy.
# disabled 2026-08-07: the redirect zone broke acme dns-01 renewal (wildcard
# cert expired). apex SOA/NS local-data plus a transparent _acme-challenge
# subzone fixed zone discovery but the propagation check still timed out.
# public *.nx3.eu already resolves to 192.168.20.200 via deSEC.
#local-zone: "nx3.eu." redirect
#local-data: "nx3.eu. 3600 IN A 192.168.20.200"
#local-data: "nx3.eu. 3600 IN SOA get.desec.io. get.desec.io. 1 86400 3600 2419200 3600"
#local-data: "nx3.eu. 3600 IN NS ns1.desec.io."
#local-data: "nx3.eu. 3600 IN NS ns2.desec.org."
#local-zone: "_acme-challenge.nx3.eu." transparent

statistics-cumulative: yes

# see: https://unbound.docs.nlnetlabs.nl/en/latest/topics/core/serve-stale.html
# prefetch: already enabled by UCI recursion=aggressive
serve-expired: yes
serve-expired-ttl: 86400
serve-expired-client-timeout: 0

## OPT

# cache size (override UCI resource=large defaults which are too small for 1GB RAM)
msg-cache-size: 32m
rrset-cache-size: 64m

# more outgoing connections
# with libevent
outgoing-range: 8192
num-queries-per-thread: 4096

# improve udp performance on linux
so-reuseport: yes
