# adguard home — reference config (not auto-deployed)
# restore options/keys manually
# web UI
http:
  address: 192.168.10.1:8080
# dns: clients → adguard (53) → unbound (5335)
dns:
  bind_hosts:
    - fd8a:2e59:7bfd::1
    - fd8a:2e59:7bfd:20::1
    - 192.168.10.1
    - 192.168.20.1
    - 127.0.0.1
  port: 53
  # 2026-09-10: was 100 per /24, which is one bucket for a whole vlan; nixbox
  # and the microvms behind its nat shared it and lost a third of their
  # queries at 60 qps, which surfaced as resolved falling back from EDNS0 and
  # as 502s in fencr's credential proxy. measured with dnsperf: 150 qps loses
  # 25% at 100, nothing at 1000. the whitelist below had no effect on the
  # drops, so the limit itself has to be liveable.
  ratelimit: 1000
  ratelimit_subnet_len_ipv4: 32
  ratelimit_subnet_len_ipv6: 128
  ratelimit_whitelist:
    # nixbox; ineffective in this adguard version, kept for intent
    - 192.168.20.200
    - fd8a:2e59:7bfd:20::502
  upstream_dns:
    # unbound
    - 127.0.0.1:5335
  bootstrap_dns:
    # unbound
    - 127.0.0.1:5335
  local_ptr_upstreams:
    # unbound
    - 127.0.0.1:5335
  use_private_ptr_resolvers: true
  enable_dnssec: true
  cache_enabled: false
  cache_size: 0 # 0MB
  cache_ttl_min: 600
  cache_ttl_max: 86400
  cache_optimistic: true
# filter lists
filters:
  - enabled: true
    # full TIF (filter_44) needs >=2GB RAM in AGH; caused OOM wedge 2026-07-18
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/tif.medium.txt
    name: HaGeZi's Threat Intelligence Feeds (Medium)
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_45.txt
    name: HaGeZi's Allowlist Referral
  - enabled: true
    url: https://adguardteam.github.io/HostlistsRegistry/assets/filter_51.txt
    name: HaGeZi's Pro++ Blocklist
  - enabled: true
    # blocks DoH resolver domains so clients cannot bypass filtering; DoT blocked by firewall (853)
    url: https://raw.githubusercontent.com/hagezi/dns-blocklists/main/adblock/doh.txt
    name: HaGeZi DoH Bypass Blocklist
