id = "herdr-jj"
name = "jj"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Report the nearest jj bookmark of each workspace as the $jj_bookmark sidebar token."
platforms = ["linux", "macos"]

[[startup]]
command = ["@out@/bin/herdr-jj"]

[[events]]
on = "workspace.created"
command = ["@out@/bin/herdr-jj"]

[[events]]
on = "workspace.focused"
command = ["@out@/bin/herdr-jj"]

[[events]]
on = "pane.agent_status_changed"
command = ["@out@/bin/herdr-jj"]
