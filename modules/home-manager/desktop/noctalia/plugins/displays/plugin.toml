# Merged v5 port of Mic92/noctalia-plugins display-config (kanshi/niri display
# control) and legacy-v4 mirror-mirror (wl-mirror). One panel: per-output
# power/mode/scale, two-output arrangements, kanshi profile save/switch, and
# screen mirroring. Outputs go through wlr-randr, so any compositor with
# wlr-output-management works.
#
# Game mode switches one output to a custom mode (wlr-randr --custom-mode).
# Under umbriel it also writes the optional include gamemode_umbriel_file with
# hdr = "off" for that output; the umbriel config must include that file
# after its output sections. Leaving game mode empties the file, which makes
# umbriel reapply its configured mode and HDR; elsewhere kanshictl reload
# restores the layout.
#
# Saved profiles live in ~/.config/kanshi/noctalia.conf (mutable runtime
# state by design); the noctalia HM module prepends the include to
# services.kanshi.settings and seeds the file on activation.
#
# IPC (noctalia msg plugin fosskar/displays:service all <event> [payload]):
#   toggle | refresh | keep | revert
#   arrange <extend-right|extend-left|stack-above|stack-below|external-only|internal-only>
#   kanshiSwitch <name> | kanshiSave <name>
#   mirrorStart <source> <destination> | mirrorStop
#   gamemode [on|off]  (no payload toggles)

id = "fosskar/displays"
name = "Displays"
version = "1.0.0"
plugin_api = 3
author = "fosskar"
license = "MIT"
tags = ["display", "monitor", "kanshi", "mirror"]
icon = "device-desktop"
description = "Monitor power, mode, scale, layout, kanshi profiles, and screen mirroring."
dependencies = ["wlr-randr", "kanshi", "wl-mirror", "wdisplays"]

[[setting]]
key = "poll_interval"
type = "int"
label_key = "settings.poll_interval.label"
description_key = "settings.poll_interval.description"
default = 30
min = 5
max = 300

[[setting]]
key = "kanshi_enabled"
type = "bool"
label_key = "settings.kanshi_enabled.label"
default = true

[[setting]]
key = "kanshi_config_dir"
type = "string"
label_key = "settings.kanshi_config_dir.label"
default = ""

[[setting]]
key = "gamemode_output"
type = "string"
label_key = "settings.gamemode_output.label"
default = ""

[[setting]]
key = "gamemode_mode"
type = "string"
label_key = "settings.gamemode_mode.label"
description_key = "settings.gamemode_mode.description"
default = ""

[[setting]]
key = "gamemode_umbriel_file"
type = "string"
label_key = "settings.gamemode_umbriel_file.label"
default = "~/.config/umbriel/gamemode.toml"

[[service]]
id = "service"
entry = "service.luau"

[[panel]]
id = "panel"
entry = "panel.luau"
width = 560
height = 720
# noctalia.togglePanel() from Luau carries no click anchor (script_api_context.h
# togglePanelHook is id-only), so open_near_click can't work for plugin panels.
# Centered so notification toasts (top_right) never cover the revert/keep bar.
placement = "floating"
position = "center"

[[widget]]
id = "indicator"
entry = "widget.luau"
